<style>
/* 따뜻한 생일 페이지 장식 */
body {
  background:
    radial-gradient(circle at 10% 10%, #fff7ef, transparent 35%),
    linear-gradient(180deg, #f8eee7, #eee3d8);
  overflow-x: hidden;
}

/* 제목에 우아한 효과 */
h1 {
  color: #59483f;
  letter-spacing: 1px;
  animation: fadeIn 1.5s ease;
}

/* 카드에 입체감 */
.card, section {
  border-radius: 28px;
  box-shadow: 0 12px 35px rgba(100, 70, 50, 0.08);
}

/* 둥실둥실 떠오르는 하트 */
.floating-heart {
  position: fixed;
  bottom: -40px;
  color: #c68d85;
  font-size: 22px;
  pointer-events: none;
  z-index: 10;
  animation: floatUp 7s linear forwards;
}

@keyframes floatUp {
  0% {
    transform: translateY(0) rotate(0deg);
    opacity: 0;
  }
  15% { opacity: 0.8; }
  100% {
    transform: translateY(-110vh) rotate(35deg);
    opacity: 0;
  }
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>

<script>
setInterval(() => {
  const heart = document.createElement("div");
  heart.className = "floating-heart";
  heart.textContent = ["♡", "♥", "✿", "✨"][
    Math.floor(Math.random() * 4)
  ];

  heart.style.left = Math.random() * 95 + "vw";
  heart.style.animationDuration =
    (5 + Math.random() * 4) + "s";

  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 9000);
}, 900);
</script>

<script>
// Supabase 대시보드에서 복사한 값으로 교체하세요.
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";
const BUCKET = "birthday-photos";

const configured =
  SUPABASE_URL.startsWith("https://") &&
  !SUPABASE_URL.includes("YOUR_SUPABASE") &&
  SUPABASE_KEY &&
  !SUPABASE_KEY.includes("YOUR_SUPABASE");

const db = configured
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
  : null;

const form = document.getElementById("form");
const photoInput = document.getElementById("photo");
const preview = document.getElementById("preview");
const statusBox = document.getElementById("status");
const messagesBox = document.getElementById("messages");
const submitButton = document.getElementById("submit");
let selectedPhoto = null;

function textElement(tag, className, text) {
  const el = document.createElement(tag);
  el.className = className;
  el.textContent = text;
  return el;
}

// 사진 선택 및 미리보기
photoInput.addEventListener("change", () => {
  selectedPhoto = photoInput.files[0] || null;

  if (!selectedPhoto) {
    preview.style.display = "none";
    preview.removeAttribute("src");
    return;
  }

  if (!selectedPhoto.type.startsWith("image/") ||
      selectedPhoto.size > 5 * 1024 * 1024) {
    alert("이미지 파일을 5MB 이하로 선택해 주세요. · 請選擇小於 5MB 的圖片。");
    photoInput.value = "";
    selectedPhoto = null;
    preview.style.display = "none";
    return;
  }

  preview.src = URL.createObjectURL(selectedPhoto);
  preview.style.display = "block";
});

// 저장된 메시지 표시
async function loadMessages() {
  if (!db) {
    messagesBox.replaceChildren(textElement(
      "div", "empty",
      "Supabase 설정이 필요해요. · 請先完成 Supabase 設定。"
    ));
    return;
  }

  const { data, error } = await db
    .from("birthday_messages")
    .select("id,nickname,message,photo_url,created_at")
    .order("created_at", { ascending: false })
    .limit(100);

  if (error) {
    console.error(error);
    messagesBox.replaceChildren(textElement(
      "div", "empty",
      "留言載入失敗，請檢查設定。 · 메시지를 불러오지 못했어요."
    ));
    return;
  }

  messagesBox.replaceChildren();

  if (!data.length) {
    messagesBox.appendChild(textElement(
      "div", "empty",
      "첫 번째 축하 메시지를 남겨 주세요 ♡ · 歡迎留下第一則祝福 ♡"
    ));
    return;
  }

  data.forEach(item => {
    const card = document.createElement("article");
    card.className = "message-card";

    card.appendChild(textElement("div", "", "♡ " + item.nickname));
    card.appendChild(textElement("p", "", item.message));

    if (item.photo_url) {
      const img = document.createElement("img");
      img.src = item.photo_url;
      img.alt = "가족사진 · 家庭照片";
      img.loading = "lazy";
      card.appendChild(img);
    }

    if (item.created_at) {
      card.appendChild(textElement(
        "div", "date",
        new Date(item.created_at).toLocaleString("zh-TW")
      ));
    }

    messagesBox.appendChild(card);
  });
}

// 메시지 및 선택 사진 저장
form.addEventListener("submit", async event => {
  event.preventDefault();

  if (!db) {
    statusBox.textContent =
      "Supabase URL과 Publishable key를 먼저 입력해 주세요.";
    return;
  }
