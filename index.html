<!DOCTYPE html>

<style>
/* 따뜻한 생일 페이지 장식 */
body {
  background:
    radial-gradient(circle at 10% 10%, #fff7ef, transparent 35%),
    linear-gradient(180deg, #f8eee7, #eee3d8);
  overflow-x: hidden;
}

/* 제목에 우아한 효과 */
h1 {
  color: #59483f;
  letter-spacing: 1px;
  animation: fadeIn 1.5s ease;
}

/* 카드에 입체감 */
.card, section {
  border-radius: 28px;
  box-shadow: 0 12px 35px rgba(100, 70, 50, 0.08);
}

/* 둥실둥실 떠오르는 하트 */
.floating-heart {
  position: fixed;
  bottom: -40px;
  color: #c68d85;
  font-size: 22px;
  pointer-events: none;
  z-index: 10;
  animation: floatUp 7s linear forwards;
}

@keyframes floatUp {
  0% {
    transform: translateY(0) rotate(0deg);
    opacity: 0;
  }
  15% { opacity: 0.8; }
  100% {
    transform: translateY(-110vh) rotate(35deg);
    opacity: 0;
  }
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>

<script>
setInterval(() => {
  const heart = document.createElement("div");
  heart.className = "floating-heart";
  heart.textContent = ["♡", "♥", "✿", "✨"][
    Math.floor(Math.random() * 4)
  ];

  heart.style.left = Math.random() * 95 + "vw";
  heart.style.animationDuration =
    (5 + Math.random() * 4) + "s";

  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 9000);
}, 900);
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
body {
    text-align: center;
    background: #fff0f5;
    font-family: sans-serif;
}

h2 {
    color: #ff69a4;
}

textarea {
    width: 80%;
    height: 120px;
    border: 2px solid #ffb6c1;
    border-radius: 15px;
    padding: 15px;
    font-size: 16px;
    box-sizing: border-box;
}

button {
    background: #ff85a2;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 25px;
    font-size: 16px;
    cursor: pointer;
}

#result {
    display: none;
    background: white;
    color: #e75480;
    margin: 25px auto;
    padding: 25px;
    width: 75%;
    border-radius: 20px;
    box-shadow: 0 4px 12px #f3b6c8;
    white-space: pre-wrap;
    line-height: 1.8;
    box-sizing: border-box;
}
</style>
</head>

<body>

<h2>💗 엄마에게 보내는 편지 💗</h2>

<textarea id="message"
placeholder="엄마에게 사랑의 메시지를 적어주세요💕"></textarea>

<br><br>

<button onclick="sendMessage()">
💌 메시지 남기기
</button>

<div id="result"></div>

<script>
function sendMessage() {
    let message = document.getElementById("message").value;

    if (message.trim() === "") {
        alert("메시지를 적어주세요!");
        return;
    }

    let result = document.getElementById("result");

    result.innerText = "💗 사랑하는 엄마에게 💗\n\n"
        + message + "\n\n🌷 사랑해요 🌷";

    result.style.display = "block";
}
</script>

</body>
